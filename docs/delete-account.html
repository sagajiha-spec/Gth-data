<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainer Note</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script src="site.js"></script><script>render({"ko": {"title": "트레이너 노트 계정 삭제 안내", "updated": "최종 수정: 2026-11-23", "sections": [["앱에서 바로 지우기", "루틴 탭 → 비비용 친추코드 → 오른쪽 위 사람 아이콘 → <b>계정 삭제</b>. 계정과 닉네임, 올린 모든 친구 코드가 즉시 지워집니다."], ["앱이 없을 때", "로그인에 쓴 구글 계정 이메일로 {mail} 에 \"계정 삭제 요청\"이라고 보내 주세요. 30일 안에 지우고 답장드립니다."], ["지워지는 정보", ["구글 로그인 기록(계정 ID·이메일)", "닉네임, 친구 코드, 무늬, 보유·필요 포켓몬"]], ["남는 정보", ["다른 사람 코드에 남긴 신고 기록(익명 ID)은 그 코드가 지워질 때 함께 지워집니다.", "휴대폰에만 저장된 정보(설정·즐겨찾기 등)는 앱을 지우면 지워집니다."]], ["개인정보처리방침", "<a href=\"privacy.html\">개인정보처리방침 보기</a>"]]}, "en": {"title": "Trainer Note Account Deletion", "updated": "Last updated: 2026-11-23", "sections": [["Delete in the app", "Routine tab → Vivillon friend codes → person icon (top right) → <b>Delete account</b>. Your account, nickname and all codes you posted are deleted immediately."], ["Without the app", "Email {mail} with \"Account deletion request\" from the Google account email you signed in with. We will delete it within 30 days and reply."], ["What is deleted", ["Google sign-in record (account ID, email)", "Nickname, friend codes, patterns, Pokémon you have/need"]], ["What remains", ["Report records you left on others' codes (anonymous ID) are removed when those codes are deleted.", "Data stored only on your phone (settings, favorites, etc.) is removed when you uninstall the app."]], ["Privacy Policy", "<a href=\"privacy.html\">View the Privacy Policy</a>"]]}, "ja": {"title": "Trainer Note アカウント削除のご案内", "updated": "最終更新：2026-11-23", "sections": [["アプリで削除", "ルーティンタブ → ビビヨン用フレンドコード → 右上の人のアイコン → <b>アカウント削除</b>。アカウント、ニックネーム、投稿したすべてのコードがすぐに削除されます。"], ["アプリがない場合", "ログインに使ったGoogleアカウントのメールから {mail} へ「アカウント削除依頼」と送ってください。30日以内に削除してご返信します。"], ["削除される情報", ["Googleログイン記録（アカウントID・メール）", "ニックネーム、フレンドコード、模様、持っている・ほしいポケモン"]], ["残る情報", ["他の人のコードに残した通報記録（匿名ID）は、そのコードが削除されると一緒に消えます。", "端末内だけの情報（設定・お気に入りなど）はアプリを削除すると消えます。"]], ["プライバシーポリシー", "<a href=\"privacy.html\">プライバシーポリシーを見る</a>"]]}, "zh-Hant": {"title": "Trainer Note 帳號刪除說明", "updated": "最後更新：2026-11-23", "sections": [["在應用程式中刪除", "例行公事分頁 → 彩粉蝶好友代碼 → 右上角人像圖示 → <b>刪除帳號</b>。帳號、暱稱與你上傳的所有代碼會立即刪除。"], ["沒有應用程式時", "請用登入時使用的 Google 帳號信箱寄信到 {mail}，主旨寫「刪除帳號申請」。我們會在 30 天內刪除並回覆。"], ["會刪除的資訊", ["Google 登入紀錄（帳號 ID、電子郵件）", "暱稱、好友代碼、花紋、擁有/需要的寶可夢"]], ["會留下的資訊", ["你在他人代碼留下的檢舉紀錄（匿名 ID）會在該代碼刪除時一併刪除。", "只存在手機的資料（設定、我的最愛等）會在刪除應用程式時刪除。"]], ["隱私權政策", "<a href=\"privacy.html\">查看隱私權政策</a>"]]}, "zh-Hans": {"title": "Trainer Note 账号删除说明", "updated": "最后更新：2026-11-23", "sections": [["在应用中删除", "例行事项标签 → 彩粉蝶好友代码 → 右上角人像图标 → <b>删除账号</b>。账号、昵称与你上传的所有代码会立即删除。"], ["没有应用时", "请用登录时使用的 Google 账号邮箱发信到 {mail}，主题写“删除账号申请”。我们会在 30 天内删除并回复。"], ["会删除的信息", ["Google 登录记录（账号 ID、电子邮件）", "昵称、好友代码、花纹、拥有/需要的宝可梦"]], ["会保留的信息", ["你在他人代码留下的举报记录（匿名 ID）会在该代码删除时一并删除。", "只存在手机的数据（设置、收藏等）会在卸载应用时删除。"]], ["隐私政策", "<a href=\"privacy.html\">查看隐私政策</a>"]]}, "fr": {"title": "Trainer Note – Suppression du compte", "updated": "Dernière mise à jour : 23/11/2026", "sections": [["Supprimer dans l'application", "Onglet Routine → Codes ami Prismillon → icône de personne (en haut à droite) → <b>Supprimer le compte</b>. Votre compte, votre pseudo et tous vos codes sont supprimés immédiatement."], ["Sans l'application", "Écrivez à {mail} avec l'objet « Demande de suppression de compte » depuis l'adresse Google utilisée pour la connexion. Nous supprimerons tout sous 30 jours et vous répondrons."], ["Ce qui est supprimé", ["Données de connexion Google (identifiant, e-mail)", "Pseudo, codes ami, motifs, Pokémon possédés/recherchés"]], ["Ce qui reste", ["Les signalements laissés sur les codes d'autres personnes (identifiant anonyme) sont supprimés avec ces codes.", "Les données stockées uniquement sur le téléphone (paramètres, favoris…) sont supprimées en désinstallant l'application."]], ["Politique de confidentialité", "<a href=\"privacy.html\">Voir la politique de confidentialité</a>"]]}, "de": {"title": "Trainer Note – Kontolöschung", "updated": "Zuletzt aktualisiert: 23.11.2026", "sections": [["In der App löschen", "Tab Routine → Vivillon-Freundescodes → Personensymbol (oben rechts) → <b>Konto löschen</b>. Konto, Spitzname und alle veröffentlichten Codes werden sofort gelöscht."], ["Ohne die App", "Schreibe von der E-Mail-Adresse deines Google-Kontos an {mail} mit dem Betreff „Antrag auf Kontolöschung“. Wir löschen alles innerhalb von 30 Tagen und antworten dir."], ["Was gelöscht wird", ["Google-Anmeldedaten (Konto-ID, E-Mail)", "Spitzname, Freundescodes, Muster, Pokémon, die du hast/suchst"]], ["Was bleibt", ["Meldungen bei Codes anderer (anonyme ID) werden mit diesen Codes gelöscht.", "Nur auf dem Handy gespeicherte Daten (Einstellungen, Favoriten usw.) werden beim Deinstallieren gelöscht."]], ["Datenschutzerklärung", "<a href=\"privacy.html\">Datenschutzerklärung ansehen</a>"]]}, "es": {"title": "Trainer Note – Eliminación de cuenta", "updated": "Última actualización: 23/11/2026", "sections": [["Eliminar en la app", "Pestaña Rutina → Códigos de amigo de Vivillon → icono de persona (arriba a la derecha) → <b>Eliminar cuenta</b>. Tu cuenta, tu apodo y todos tus códigos se eliminan al instante."], ["Sin la app", "Escribe a {mail} con el asunto «Solicitud de eliminación de cuenta» desde el correo de la cuenta de Google con la que iniciaste sesión. La eliminaremos en un plazo de 30 días y te responderemos."], ["Qué se elimina", ["Registro de inicio de sesión de Google (ID de cuenta, correo)", "Apodo, códigos de amigo, diseños, Pokémon que tienes/buscas"]], ["Qué queda", ["Las denuncias en códigos de otros (ID anónimo) se borran cuando se eliminan esos códigos.", "Los datos guardados solo en el teléfono (ajustes, favoritos, etc.) se borran al desinstalar la app."]], ["Política de privacidad", "<a href=\"privacy.html\">Ver la política de privacidad</a>"]]}, "it": {"title": "Trainer Note – Eliminazione dell'account", "updated": "Ultimo aggiornamento: 23/11/2026", "sections": [["Eliminare nell'app", "Scheda Routine → Codici amico Vivillon → icona persona (in alto a destra) → <b>Elimina account</b>. Account, nickname e tutti i codici pubblicati vengono eliminati subito."], ["Senza l'app", "Scrivi a {mail} con oggetto «Richiesta di eliminazione account» dall'email dell'account Google usato per l'accesso. Lo elimineremo entro 30 giorni e ti risponderemo."], ["Cosa viene eliminato", ["Dati di accesso Google (ID account, email)", "Nickname, codici amico, motivi, Pokémon che hai/cerchi"]], ["Cosa resta", ["Le segnalazioni sui codici di altri (ID anonimo) vengono eliminate insieme a quei codici.", "I dati salvati solo sul telefono (impostazioni, preferiti ecc.) vengono eliminati disinstallando l'app."]], ["Informativa sulla privacy", "<a href=\"privacy.html\">Leggi l'informativa sulla privacy</a>"]]}});</script></body></html>
