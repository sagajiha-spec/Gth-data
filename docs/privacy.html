<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trainer Note</title><link rel="stylesheet" href="style.css"></head><body><div id="app"></div><script src="site.js"></script><script>render({"ko": {"title": "트레이너 노트 개인정보처리방침", "updated": "최종 수정: 2026-11-23", "sections": [["이 앱에 대해", "트레이너 노트는 포켓몬 GO 플레이어를 위한 <b>비공식 팬 도구</b>입니다. Niantic, The Pokémon Company, Nintendo와 관련이 없습니다."], ["로그인 없이 쓰는 기능", ["설정, 즐겨찾기, 메모, 알람, 미니게임 기록 등은 <b>내 휴대폰에만</b> 저장되고 우리에게 보내지지 않습니다.", "앱을 지우면 함께 지워집니다."]], ["비비용 친구 코드 (구글 로그인)", ["로그인할 때: 구글 계정의 고유 ID와 이메일 주소. 이메일은 로그인에만 쓰고 다른 사람에게 보이지 않습니다.", "직접 올리는 정보: 닉네임, 친구 코드, 비비용 무늬, 보유·필요 포켓몬, 올린·고친 시각", "신고 기록: 누가 어떤 코드를 신고했는지(같은 코드를 두 번 신고하지 못하게), 신고 수", "다른 로그인 사용자에게 보이는 것: 닉네임, 친구 코드, 무늬, 보유·필요 포켓몬", "목적: 친구 코드 게시판 운영과 도배·악용 방지", "저장 위치: Google Firebase (서버가 다른 나라에 있을 수 있습니다)"]], ["위치", "\"나의 비비용 알기\"를 누르면 대략적인 위치로 내 지역의 비비용 무늬를 찾습니다. 위치는 휴대폰의 주소 찾기 기능(안드로이드·구글)에만 쓰이고, 우리에게 저장되거나 보내지지 않습니다."], ["알림", "고른 일정 알람과 우정 레벨업 알람은 휴대폰 안에서만 예약됩니다."], ["광고", "광고가 켜진 버전에서는 Google AdMob이 광고를 보여 주며, 광고 ID와 기기 정보를 쓸 수 있습니다. 유럽·영국 등에서는 동의 화면이 나오고, 설정의 \"광고 개인정보 옵션\"에서 바꿀 수 있습니다."], ["그 밖의 외부 서비스", ["일정 등 최신 데이터는 공개 저장소(GitHub)에서 받습니다.", "테마 글꼴은 Google Fonts에서 받습니다.", "친구 코드 서버 보호를 위해 Google Play Integrity(App Check)로 정품 앱인지 확인합니다."]], ["보관과 삭제", ["친구 코드 정보는 직접 지우거나 계정을 삭제할 때까지 보관합니다.", "계정 삭제 방법: <a href=\"delete-account.html\">계정 삭제 안내</a>", "다른 사람 코드에 남긴 신고 기록(익명 ID)은 그 코드가 지워질 때 함께 지워집니다."]], ["어린이", "이 앱은 만 13세 미만 어린이를 대상으로 하지 않습니다."], ["문의", "{mail}"], ["변경", "방침이 바뀌면 이 페이지에 알리고 날짜를 고칩니다."]]}, "en": {"title": "Trainer Note Privacy Policy", "updated": "Last updated: 2026-11-23", "sections": [["About this app", "Trainer Note is an <b>unofficial fan tool</b> for Pokémon GO players. It is not affiliated with Niantic, The Pokémon Company or Nintendo."], ["Features without sign-in", ["Settings, favorites, notes, alarms and mini-game records are stored <b>only on your phone</b> and are not sent to us.", "They are removed when you uninstall the app."]], ["Vivillon friend codes (Google sign-in)", ["When you sign in: your Google account's unique ID and email address. The email is used only for sign-in and is never shown to others.", "What you post: nickname, friend code, Vivillon pattern, Pokémon you have/need, time posted/edited", "Report records: who reported which code (to prevent double reports) and the report count", "Visible to other signed-in users: nickname, friend code, pattern, Pokémon you have/need", "Purpose: running the friend code board and preventing spam or abuse", "Storage: Google Firebase (servers may be in another country)"]], ["Location", "\"Find my Vivillon\" uses your approximate location to find your region's Vivillon pattern. It is only passed to your phone's address lookup (Android/Google) and is never stored by or sent to us."], ["Notifications", "Event and friendship level-up alarms are scheduled only on your phone."], ["Ads", "In versions with ads, Google AdMob shows ads and may use your advertising ID and device information. In the EEA, UK and similar regions a consent screen appears, and you can change it in Settings > Ad privacy options."], ["Other services", ["Up-to-date data such as events is downloaded from a public repository (GitHub).", "Theme fonts are downloaded from Google Fonts.", "To protect the friend code server, Google Play Integrity (App Check) checks that the app is genuine."]], ["Retention and deletion", ["Friend code data is kept until you delete it or delete your account.", "How to delete your account: <a href=\"delete-account.html\">Account deletion</a>", "Report records you left on others' codes (anonymous ID) are removed when those codes are deleted."]], ["Children", "This app is not directed to children under 13."], ["Contact", "{mail}"], ["Changes", "If this policy changes, we will post it on this page and update the date."]]}, "ja": {"title": "Trainer Note プライバシーポリシー", "updated": "最終更新：2026-11-23", "sections": [["このアプリについて", "Trainer NoteはポケモンGOプレイヤーのための<b>非公式ファンツール</b>です。Niantic、株式会社ポケモン、任天堂とは関係ありません。"], ["ログインなしで使える機能", ["設定・お気に入り・メモ・アラーム・ミニゲームの記録などは<b>端末内だけ</b>に保存され、私たちには送られません。", "アプリを削除すると一緒に消えます。"]], ["ビビヨンのフレンドコード（Googleログイン）", ["ログイン時：GoogleアカウントのIDとメールアドレス。メールはログインにのみ使い、他の人には表示されません。", "投稿する情報：ニックネーム、フレンドコード、ビビヨンの模様、持っている・ほしいポケモン、投稿・編集時刻", "通報記録：誰がどのコードを通報したか（二重通報防止）と通報数", "他のログインユーザーに表示：ニックネーム、フレンドコード、模様、持っている・ほしいポケモン", "目的：フレンドコード掲示板の運営と荒らし・悪用の防止", "保存先：Google Firebase（サーバーが他国にある場合があります）"]], ["位置情報", "「自分のビビヨンを調べる」は、おおよその位置から地域のビビヨンの模様を探します。位置は端末の住所検索機能（Android・Google）にだけ使われ、私たちが保存・受信することはありません。"], ["通知", "選んだイベントや仲良し度アップのアラームは端末内だけで予約されます。"], ["広告", "広告のあるバージョンではGoogle AdMobが広告を表示し、広告IDや端末情報を使う場合があります。EEA・英国などでは同意画面が表示され、設定の「広告のプライバシーオプション」で変更できます。"], ["その他の外部サービス", ["イベントなど最新データは公開リポジトリ（GitHub）から取得します。", "テーマのフォントはGoogle Fontsから取得します。", "フレンドコードのサーバー保護のため、Google Play Integrity（App Check）で正規アプリか確認します。"]], ["保存と削除", ["フレンドコードの情報は、自分で削除するかアカウントを削除するまで保存します。", "アカウント削除の方法：<a href=\"delete-account.html\">アカウント削除のご案内</a>", "他の人のコードに残した通報記録（匿名ID）は、そのコードが削除されると一緒に消えます。"]], ["子ども", "このアプリは13歳未満の子どもを対象としていません。"], ["お問い合わせ", "{mail}"], ["変更", "ポリシーが変わる場合はこのページでお知らせし、日付を更新します。"]]}, "zh-Hant": {"title": "Trainer Note 隱私權政策", "updated": "最後更新：2026-11-23", "sections": [["關於本應用程式", "Trainer Note 是為 Pokémon GO 玩家製作的<b>非官方粉絲工具</b>，與 Niantic、The Pokémon Company、Nintendo 無關。"], ["不需登入的功能", ["設定、我的最愛、備註、鬧鐘、小遊戲紀錄等<b>只儲存在你的手機</b>，不會傳送給我們。", "刪除應用程式時會一併刪除。"]], ["彩粉蝶好友代碼（Google 登入）", ["登入時：Google 帳號的唯一 ID 與電子郵件。電子郵件只用於登入，不會顯示給他人。", "你上傳的資訊：暱稱、好友代碼、彩粉蝶花紋、擁有/需要的寶可夢、上傳與修改時間", "檢舉紀錄：誰檢舉了哪個代碼（防止重複檢舉）與檢舉次數", "其他已登入使用者可看到：暱稱、好友代碼、花紋、擁有/需要的寶可夢", "目的：經營好友代碼佈告欄並防止灌水或濫用", "儲存位置：Google Firebase（伺服器可能位於其他國家）"]], ["位置", "「查看我的彩粉蝶」會以大致位置找出你所在地區的彩粉蝶花紋。位置只交給手機的地址查詢功能（Android/Google），不會由我們儲存或接收。"], ["通知", "你選擇的活動鬧鐘與友誼等級提升鬧鐘只在手機內設定。"], ["廣告", "有廣告的版本由 Google AdMob 顯示廣告，可能使用廣告 ID 與裝置資訊。在歐洲經濟區、英國等地區會顯示同意畫面，可在設定的「廣告隱私權選項」中變更。"], ["其他外部服務", ["活動等最新資料從公開儲存庫（GitHub）下載。", "主題字型從 Google Fonts 下載。", "為保護好友代碼伺服器，會以 Google Play Integrity（App Check）確認是正版應用程式。"]], ["保存與刪除", ["好友代碼資料會保存到你自行刪除或刪除帳號為止。", "刪除帳號的方法：<a href=\"delete-account.html\">帳號刪除說明</a>", "你在他人代碼留下的檢舉紀錄（匿名 ID）會在該代碼刪除時一併刪除。"]], ["兒童", "本應用程式不以未滿 13 歲的兒童為對象。"], ["聯絡我們", "{mail}"], ["變更", "政策變更時會在此頁面公告並更新日期。"]]}, "zh-Hans": {"title": "Trainer Note 隐私政策", "updated": "最后更新：2026-11-23", "sections": [["关于本应用", "Trainer Note 是为 Pokémon GO 玩家制作的<b>非官方粉丝工具</b>，与 Niantic、The Pokémon Company、Nintendo 无关。"], ["无需登录的功能", ["设置、收藏、备注、闹钟、小游戏记录等<b>只保存在你的手机</b>，不会发送给我们。", "卸载应用时会一并删除。"]], ["彩粉蝶好友代码（Google 登录）", ["登录时：Google 账号的唯一 ID 与电子邮件。电子邮件只用于登录，不会显示给他人。", "你上传的信息：昵称、好友代码、彩粉蝶花纹、拥有/需要的宝可梦、上传与修改时间", "举报记录：谁举报了哪个代码（防止重复举报）与举报次数", "其他已登录用户可看到：昵称、好友代码、花纹、拥有/需要的宝可梦", "目的：运营好友代码公告栏并防止刷屏或滥用", "存储位置：Google Firebase（服务器可能位于其他国家）"]], ["位置", "“查看我的彩粉蝶”会用大致位置找出你所在地区的彩粉蝶花纹。位置只交给手机的地址查询功能（Android/Google），不会由我们保存或接收。"], ["通知", "你选择的活动闹钟与友谊等级提升闹钟只在手机内设置。"], ["广告", "有广告的版本由 Google AdMob 显示广告，可能使用广告 ID 与设备信息。在欧洲经济区、英国等地区会显示同意界面，可在设置的“广告隐私选项”中更改。"], ["其他外部服务", ["活动等最新数据从公开仓库（GitHub）下载。", "主题字体从 Google Fonts 下载。", "为保护好友代码服务器，会用 Google Play Integrity（App Check）确认是正版应用。"]], ["保存与删除", ["好友代码数据会保存到你自行删除或删除账号为止。", "删除账号的方法：<a href=\"delete-account.html\">账号删除说明</a>", "你在他人代码留下的举报记录（匿名 ID）会在该代码删除时一并删除。"]], ["儿童", "本应用不以未满 13 岁的儿童为对象。"], ["联系我们", "{mail}"], ["变更", "政策变更时会在此页面公告并更新日期。"]]}, "fr": {"title": "Trainer Note – Politique de confidentialité", "updated": "Dernière mise à jour : 23/11/2026", "sections": [["À propos", "Trainer Note est un <b>outil de fan non officiel</b> pour les joueurs de Pokémon GO. Il n'est pas affilié à Niantic, The Pokémon Company ni Nintendo."], ["Fonctions sans connexion", ["Paramètres, favoris, notes, alarmes et scores du mini-jeu sont enregistrés <b>uniquement sur votre téléphone</b> et ne nous sont pas envoyés.", "Ils sont supprimés en désinstallant l'application."]], ["Codes ami Prismillon (connexion Google)", ["À la connexion : l'identifiant unique et l'adresse e-mail de votre compte Google. L'e-mail sert uniquement à la connexion et n'est jamais montré aux autres.", "Ce que vous publiez : pseudo, code ami, motif de Prismillon, Pokémon possédés/recherchés, date de publication/modification", "Signalements : qui a signalé quel code (pour éviter les doublons) et leur nombre", "Visible par les autres utilisateurs connectés : pseudo, code ami, motif, Pokémon possédés/recherchés", "Objectif : gérer le tableau des codes ami et empêcher le spam ou les abus", "Stockage : Google Firebase (les serveurs peuvent se trouver dans un autre pays)"]], ["Localisation", "« Trouver mon Prismillon » utilise votre position approximative pour trouver le motif de votre région. Elle est uniquement transmise à la recherche d'adresse du téléphone (Android/Google) et n'est jamais enregistrée ni reçue par nous."], ["Notifications", "Les alarmes d'évènements et de niveau d'amitié sont programmées uniquement sur votre téléphone."], ["Publicités", "Dans les versions avec publicités, Google AdMob affiche des annonces et peut utiliser votre identifiant publicitaire et des informations sur l'appareil. Dans l'EEE, au Royaume-Uni, etc., un écran de consentement s'affiche ; vous pouvez le modifier dans Paramètres > Options de confidentialité des annonces."], ["Autres services", ["Les données à jour (évènements, etc.) sont téléchargées depuis un dépôt public (GitHub).", "Les polices des thèmes sont téléchargées depuis Google Fonts.", "Pour protéger le serveur des codes ami, Google Play Integrity (App Check) vérifie que l'application est authentique."]], ["Conservation et suppression", ["Les données des codes ami sont conservées jusqu'à ce que vous les supprimiez ou supprimiez votre compte.", "Supprimer votre compte : <a href=\"delete-account.html\">Suppression du compte</a>", "Les signalements laissés sur les codes d'autres personnes (identifiant anonyme) sont supprimés avec ces codes."]], ["Enfants", "Cette application ne s'adresse pas aux enfants de moins de 13 ans."], ["Contact", "{mail}"], ["Modifications", "En cas de modification, nous la publierons sur cette page et mettrons la date à jour."]]}, "de": {"title": "Trainer Note – Datenschutzerklärung", "updated": "Zuletzt aktualisiert: 23.11.2026", "sections": [["Über diese App", "Trainer Note ist ein <b>inoffizielles Fan-Tool</b> für Pokémon-GO-Spieler und steht in keiner Verbindung zu Niantic, The Pokémon Company oder Nintendo."], ["Funktionen ohne Anmeldung", ["Einstellungen, Favoriten, Notizen, Wecker und Minispiel-Daten werden <b>nur auf deinem Handy</b> gespeichert und nicht an uns gesendet.", "Sie werden beim Deinstallieren der App gelöscht."]], ["Vivillon-Freundescodes (Google-Anmeldung)", ["Bei der Anmeldung: die eindeutige ID und E-Mail-Adresse deines Google-Kontos. Die E-Mail dient nur der Anmeldung und ist für andere nie sichtbar.", "Was du veröffentlichst: Spitzname, Freundescode, Vivillon-Muster, Pokémon, die du hast/suchst, Zeitpunkt der Veröffentlichung/Bearbeitung", "Meldungen: wer welchen Code gemeldet hat (gegen Doppelmeldungen) und die Anzahl", "Für andere angemeldete Nutzer sichtbar: Spitzname, Freundescode, Muster, Pokémon, die du hast/suchst", "Zweck: Betrieb der Freundescode-Pinnwand und Schutz vor Spam und Missbrauch", "Speicherort: Google Firebase (Server können in anderen Ländern stehen)"]], ["Standort", "„Mein Vivillon finden“ nutzt deinen ungefähren Standort, um das Vivillon-Muster deiner Region zu ermitteln. Er wird nur an die Adresssuche deines Handys (Android/Google) übergeben und von uns weder gespeichert noch empfangen."], ["Benachrichtigungen", "Event- und Freundschaftslevel-Wecker werden nur auf deinem Handy geplant."], ["Werbung", "In Versionen mit Werbung zeigt Google AdMob Anzeigen und kann deine Werbe-ID und Geräteinformationen nutzen. Im EWR, im Vereinigten Königreich usw. erscheint ein Einwilligungsdialog; du kannst ihn unter Einstellungen > Datenschutzoptionen für Werbung ändern."], ["Weitere Dienste", ["Aktuelle Daten wie Events werden aus einem öffentlichen Repository (GitHub) geladen.", "Design-Schriftarten werden von Google Fonts geladen.", "Zum Schutz des Freundescode-Servers prüft Google Play Integrity (App Check), ob die App echt ist."]], ["Speicherdauer und Löschung", ["Freundescode-Daten werden gespeichert, bis du sie oder dein Konto löschst.", "Konto löschen: <a href=\"delete-account.html\">Kontolöschung</a>", "Meldungen, die du bei Codes anderer hinterlassen hast (anonyme ID), werden mit diesen Codes gelöscht."]], ["Kinder", "Diese App richtet sich nicht an Kinder unter 13 Jahren."], ["Kontakt", "{mail}"], ["Änderungen", "Änderungen veröffentlichen wir auf dieser Seite und aktualisieren das Datum."]]}, "es": {"title": "Trainer Note – Política de privacidad", "updated": "Última actualización: 23/11/2026", "sections": [["Sobre esta app", "Trainer Note es una <b>herramienta no oficial hecha por fans</b> para jugadores de Pokémon GO. No está afiliada a Niantic, The Pokémon Company ni Nintendo."], ["Funciones sin iniciar sesión", ["Ajustes, favoritos, notas, alarmas y récords del minijuego se guardan <b>solo en tu teléfono</b> y no se nos envían.", "Se borran al desinstalar la app."]], ["Códigos de amigo de Vivillon (inicio con Google)", ["Al iniciar sesión: el ID único y el correo de tu cuenta de Google. El correo solo se usa para iniciar sesión y nunca se muestra a otros.", "Lo que publicas: apodo, código de amigo, diseño de Vivillon, Pokémon que tienes/buscas, fecha de publicación/edición", "Denuncias: quién denunció qué código (para evitar duplicados) y el número de denuncias", "Visible para otros usuarios con sesión iniciada: apodo, código de amigo, diseño, Pokémon que tienes/buscas", "Finalidad: gestionar el tablón de códigos de amigo y evitar spam o abusos", "Almacenamiento: Google Firebase (los servidores pueden estar en otro país)"]], ["Ubicación", "«Descubrir mi Vivillon» usa tu ubicación aproximada para encontrar el diseño de tu región. Solo se pasa a la búsqueda de direcciones del teléfono (Android/Google) y nunca la guardamos ni la recibimos."], ["Notificaciones", "Las alarmas de eventos y de nivel de amistad se programan solo en tu teléfono."], ["Anuncios", "En las versiones con anuncios, Google AdMob muestra anuncios y puede usar tu ID de publicidad e información del dispositivo. En el EEE, Reino Unido, etc. aparece una pantalla de consentimiento, que puedes cambiar en Ajustes > Opciones de privacidad de anuncios."], ["Otros servicios", ["Los datos actualizados, como los eventos, se descargan de un repositorio público (GitHub).", "Las fuentes de los temas se descargan de Google Fonts.", "Para proteger el servidor de códigos, Google Play Integrity (App Check) comprueba que la app es auténtica."]], ["Conservación y eliminación", ["Los datos de códigos de amigo se guardan hasta que los borres o elimines tu cuenta.", "Cómo eliminar tu cuenta: <a href=\"delete-account.html\">Eliminación de cuenta</a>", "Las denuncias que dejaste en códigos de otros (ID anónimo) se borran cuando se eliminan esos códigos."]], ["Menores", "Esta app no está dirigida a menores de 13 años."], ["Contacto", "{mail}"], ["Cambios", "Si la política cambia, lo publicaremos en esta página y actualizaremos la fecha."]]}, "it": {"title": "Trainer Note – Informativa sulla privacy", "updated": "Ultimo aggiornamento: 23/11/2026", "sections": [["Informazioni sull'app", "Trainer Note è uno <b>strumento non ufficiale creato da fan</b> per i giocatori di Pokémon GO. Non è affiliato a Niantic, The Pokémon Company o Nintendo."], ["Funzioni senza accesso", ["Impostazioni, preferiti, note, sveglie e record del minigioco sono salvati <b>solo sul tuo telefono</b> e non ci vengono inviati.", "Vengono eliminati disinstallando l'app."]], ["Codici amico Vivillon (accesso con Google)", ["All'accesso: l'ID univoco e l'indirizzo email del tuo account Google. L'email serve solo per l'accesso e non viene mai mostrata ad altri.", "Ciò che pubblichi: nickname, codice amico, motivo di Vivillon, Pokémon che hai/cerchi, data di pubblicazione/modifica", "Segnalazioni: chi ha segnalato quale codice (per evitare doppioni) e il numero di segnalazioni", "Visibile agli altri utenti connessi: nickname, codice amico, motivo, Pokémon che hai/cerchi", "Scopo: gestire la bacheca dei codici amico e prevenire spam o abusi", "Archiviazione: Google Firebase (i server possono trovarsi in un altro paese)"]], ["Posizione", "«Scopri il mio Vivillon» usa la tua posizione approssimativa per trovare il motivo della tua regione. Viene passata solo alla ricerca indirizzi del telefono (Android/Google) e non viene mai salvata né ricevuta da noi."], ["Notifiche", "Le sveglie per eventi e livello di amicizia sono programmate solo sul tuo telefono."], ["Pubblicità", "Nelle versioni con pubblicità, Google AdMob mostra annunci e può usare l'ID pubblicitario e le informazioni del dispositivo. Nel SEE, nel Regno Unito ecc. compare una schermata di consenso, modificabile in Impostazioni > Opzioni privacy annunci."], ["Altri servizi", ["I dati aggiornati, come gli eventi, vengono scaricati da un repository pubblico (GitHub).", "I caratteri dei temi vengono scaricati da Google Fonts.", "Per proteggere il server dei codici, Google Play Integrity (App Check) verifica che l'app sia autentica."]], ["Conservazione ed eliminazione", ["I dati dei codici amico vengono conservati finché non li elimini o elimini l'account.", "Come eliminare l'account: <a href=\"delete-account.html\">Eliminazione dell'account</a>", "Le segnalazioni lasciate sui codici di altri (ID anonimo) vengono eliminate insieme a quei codici."]], ["Minori", "Questa app non è destinata ai minori di 13 anni."], ["Contatti", "{mail}"], ["Modifiche", "Eventuali modifiche saranno pubblicate su questa pagina con la data aggiornata."]]}});</script></body></html>
